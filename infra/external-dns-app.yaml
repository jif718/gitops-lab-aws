# infra/external-dns-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.20.0
    helm:
      valuesObject:
        provider:
          name: aws
        # Hard boundary: refuse to touch records outside this zone.
        domainFilters:
          - aws.ololol.lol
        # Ownership marker written into TXT records; must be unique per cluster.
        txtOwnerId: aws-eks-platform
        policy: sync
        nodeSelector:
          kubernetes.io/arch: arm64
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::765148471972:role/aws-eks-platform-external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
